{% extends "base.html" %}

{% block title %}Delete Report · AI Health Record Translator{% endblock %}

{% block content %}

    <div class="max-w-xl mx-auto">

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 sm:p-8">

            <div class="flex items-start gap-4 mb-6">
                <div class="shrink-0 h-10 w-10 rounded-full bg-red-50 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">
                        Delete this health record?
                    </h1>
                    <p class="text-sm text-gray-500 mt-1">
                        This action cannot be undone.
                    </p>
                </div>
            </div>

            <div class="rounded-lg bg-gray-50 border border-gray-100 p-4 mb-6">
                <div class="flex items-center justify-between gap-4">
                    <div>
                        <p class="text-xs uppercase tracking-wide text-gray-400 mb-1">Category</p>
                        <p class="text-sm font-medium text-gray-900">{{ report.get_category_display }}</p>
                    </div>
                    <span class="status-badge status-badge--{{ report.status }}">
                        {{ report.get_status_display }}
                    </span>
                </div>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="flex gap-3">
                    <a href="{% url 'report_detail' report.id %}"
                       class="flex-1 text-center px-5 py-2.5 rounded-lg text-sm font-medium
                              text-gray-600 border border-gray-300 hover:bg-gray-50 transition">
                        Cancel
                    </a>
                    <button
                        type="submit"
                        class="flex-1 px-5 py-2.5 rounded-lg text-sm font-medium text-white
                               bg-red-600 hover:bg-red-700 transition focus:outline-none
                               focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
                    >
                        Delete Record
                    </button>
                </div>
            </form>

        </div>

    </div>

{% endblock %}
