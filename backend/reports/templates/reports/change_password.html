<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto py-12 px-6">

        <!-- Header -->

        <div class="flex justify-between items-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Change Password
            </h1>

            <a
                href="{% url 'profile' %}"
                class="text-blue-600 hover:underline"
            >
                Back to Profile
            </a>

        </div>


        <!-- Password Card -->

        <div class="bg-white rounded-xl shadow-md p-8">

            <form method="POST">

                {% csrf_token %}


                <!-- Display Form Errors -->

                {% if form.errors %}

                    <div class="bg-red-100 border border-red-300
                                text-red-700 rounded-lg p-4 mb-6">

                        <p class="font-semibold mb-2">
                            Please correct the following errors:
                        </p>

                        {{ form.errors }}

                    </div>

                {% endif %}


                <!-- Current Password -->

                <div class="mb-5">

                    <label
                        for="{{ form.old_password.id_for_label }}"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        Current Password
                    </label>

                    {{ form.old_password }}

                </div>


                <!-- New Password -->

                <div class="mb-5">

                    <label
                        for="{{ form.new_password1.id_for_label }}"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        New Password
                    </label>

                    {{ form.new_password1 }}

                </div>


                <!-- Confirm Password -->

                <div class="mb-6">

                    <label
                        for="{{ form.new_password2.id_for_label }}"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        Confirm New Password
                    </label>

                    {{ form.new_password2 }}

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                           px-6 py-3 rounded-lg
                           hover:bg-blue-700 transition"
                >
                    Change Password
                </button>

            </form>

        </div>

    </div>

</body>

</html>
