<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto py-12 px-6">

        <!-- Header -->

        <div class="flex justify-between items-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                My Profile
            </h1>

            <a
                href="{% url 'report_list' %}"
                class="text-blue-600 hover:underline"
            >
                Back to Reports
            </a>

        </div>


        <!-- Profile Card -->

        <div class="bg-white rounded-xl shadow-md p-8">

            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="mb-5">

                    <label
                        for="username"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        value="{{ user.username }}"
                        required
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label
                        for="email"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email }}"
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- First Name -->

                <div class="mb-5">

                    <label
                        for="first_name"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ user.first_name }}"
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- Last Name -->

                <div class="mb-6">

                    <label
                        for="last_name"
                        class="block text-gray-700 font-medium mb-2"
                    >
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ user.last_name }}"
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- Save Button -->

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                           px-6 py-3 rounded-lg
                           hover:bg-blue-700 transition"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</body>

</html>
