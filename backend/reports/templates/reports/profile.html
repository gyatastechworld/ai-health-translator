{% extends "base.html" %}

{% block title %}My Profile · AI Health Record Translator{% endblock %}

{% block content %}

    <div class="max-w-2xl mx-auto">

        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-900">
                My Profile
            </h1>
            <a href="{% url 'report_list' %}" class="text-sm text-blue-600 hover:underline">
                &larr; Back to Reports
            </a>
        </div>

        <!-- Profile Details -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 sm:p-8 mb-6">

            <h2 class="text-sm font-semibold text-gray-700 mb-5">
                Account Details
            </h2>

            <form method="POST" class="space-y-5">

                {% csrf_token %}

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Username
                    </label>
                    <input type="text" id="username" name="username" value="{{ user.username }}" required class="form-input">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Email
                    </label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" class="form-input">
                </div>

                <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1.5">
                            First Name
                        </label>
                        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" class="form-input">
                    </div>

                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1.5">
                            Last Name
                        </label>
                        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" class="form-input">
                    </div>
                </div>

                <div class="pt-2">
                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm font-medium
                               hover:bg-blue-700 transition focus:outline-none focus:ring-2
                               focus:ring-blue-500 focus:ring-offset-2"
                    >
                        Save Changes
                    </button>
                </div>

            </form>

        </div>

        <!-- Security -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 sm:p-8">

            <div class="flex items-center justify-between gap-4">
                <div>
                    <h2 class="text-sm font-semibold text-gray-700">
                        Security
                    </h2>
                    <p class="text-sm text-gray-500 mt-1">
                        Update your password to keep your account secure.
                    </p>
                </div>
                <a href="{% url 'change_password' %}"
                   class="shrink-0 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-700
                          border border-gray-300 hover:bg-gray-50 transition">
                    Change Password
                </a>
            </div>

        </div>

    </div>

{% endblock %}
